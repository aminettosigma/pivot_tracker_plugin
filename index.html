<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pivot Tracker</title>
<style>
  /* Light theme matching Sigma's default workbook surface. Light is the default;
     app.js adds .dark to <body> when the editor-panel toggle is on. */
  :root {
    --bg: #ffffff;
    --panel: #f7f8fa;
    --line: #e4e7ec;
    --line-soft: #eef0f3;
    --text: #1f2733;
    --muted: #6b7684;
    --accent: #2d6cdf;
    --danger: #b4342a;
    --hover: #f2f6fd;
  }
  body.dark {
    --bg: #1a1d23;
    --panel: #22262e;
    --line: #333944;
    --line-soft: #2a2f38;
    --text: #e6eaf0;
    --muted: #9aa6b6;
    --accent: #5a9bff;
    --danger: #ff8a7d;
    --hover: #262b34;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 12px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  /* position: relative anchors the color picker popover. */
  #root { height: 100%; display: flex; flex-direction: column; position: relative; }

  .msg { padding: 16px; color: var(--muted); }
  .msg.error { color: var(--danger); }

  .wrap { flex: 1; overflow: auto; }

  /* Fixed layout is required by row virtualization: swapping rows in and out must
     not resize columns. Widths come from a <colgroup> emitted by app.js. */
  table.pivot { border-collapse: separate; border-spacing: 0; table-layout: fixed; width: max-content; min-width: 100%; }

  /* Rows must all be exactly --row-h tall, or the scroll maths drifts. */
  tbody tr { height: var(--row-h); }
  tbody tr.spacer { height: auto; }
  tbody tr.spacer td { padding: 0; border: 0; background: transparent; }

  thead th {
    position: sticky; top: 0; z-index: 3;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); text-align: left;
    padding: 7px 10px; white-space: nowrap;
  }
  tr.hdr-sub th { top: 29px; z-index: 3; padding-top: 0; border-bottom: 1px solid var(--line); }

  th.grp { text-align: center; color: var(--text); border-left: 1px solid var(--line-soft); }
  th.grp .attr { color: var(--muted); font-weight: 600; }
  th.grp-sub { text-align: center; border-left: 1px solid var(--line-soft); }
  .vlabel { display: inline-block; padding: 0 5px; color: var(--muted); font-size: 9px; letter-spacing: .04em; }
  .vlabel + .vlabel { border-left: 1px solid var(--line); }

  /* Every left column is pinned; per-column `left` offsets are generated as
     .lead.c0/.c1/... rules from the colgroup widths. */
  th.lead, td.lead {
    position: sticky; z-index: 2;
    background: var(--bg);
    padding: 6px 12px; white-space: nowrap; color: var(--text);
    overflow: hidden; text-overflow: ellipsis;
  }
  th.lead { background: var(--panel); z-index: 4; }
  th.lead.last, td.lead.last { border-right: 1px solid var(--line); }
  td.lead { font-size: 12px; border-bottom: 1px solid var(--line-soft); }
  td.lead.first, th.lead.first { font-weight: 700; }

  tbody tr:hover td.lead { background: var(--hover); }
  tbody td { border-bottom: 1px solid var(--line-soft); }

  td.cell { padding: 3px 4px; vertical-align: middle; border-left: 1px solid var(--line-soft); }
  td.cell.empty { background: transparent; }

  .pill {
    display: flex; flex-direction: column; gap: 1px;
    width: 100%; height: 100%; min-height: 22px;
    padding: 5px 8px;
    border: 1px solid transparent; border-radius: 6px;
    font: inherit; text-align: left; cursor: pointer;
    overflow: hidden;
    transition: filter .12s ease, box-shadow .12s ease;
  }
  .pill:hover { filter: brightness(.96); }
  .pill.sel { box-shadow: 0 0 0 2px var(--accent); }
  .pill.blank { opacity: .75; }
  .pill .line {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 10px; opacity: .8;
  }
  .pill .line.l0 { opacity: .9; }
  .pill .line.l1 { font-size: 11px; font-weight: 600; opacity: 1; }
  .pill .status { font-size: 10px; font-weight: 600; opacity: .85; }
  /* Inline field name: subordinate to the value, and never the thing that wraps.
     Lines stay nowrap above, so a long label ellipsizes with its value. */
  .pill .ilbl { font-weight: 400; opacity: .72; }

  .compact .pill { padding: 3px 7px; }
  .compact td.lead { padding: 3px 12px; }

  .debug {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 8px 12px; max-height: 40%; overflow: auto;
  }
  .debug b { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
  .debug pre { margin: 6px 0 0; font-size: 10.5px; color: var(--muted); white-space: pre-wrap; }
  /* Shown only when the Max rows cap kicked in. */
  .note {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 6px 12px; font-size: 11px; color: var(--muted);
    flex: 0 0 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .note b { color: var(--text); font-weight: 600; }

  /* Legend: what each color means, and the entry point for changing one. */
  .legend {
    flex: 0 0 auto; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px;
    border-top: 1px solid var(--line); background: var(--panel); padding: 7px 12px;
  }
  .lgt {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin-right: 2px;
  }
  .lg {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: 1px solid transparent; border-radius: 5px;
    padding: 2px 6px 2px 3px; font: inherit; font-size: 11.5px; color: var(--text);
    cursor: pointer;
  }
  .lg:hover { border-color: var(--line); background: var(--bg); }
  .sw {
    width: 12px; height: 12px; border-radius: 3px; border: 1px solid transparent;
    flex: 0 0 auto;
  }
  .lgn { white-space: nowrap; }
  .lgmore { font-size: 11px; color: var(--muted); }

  /* Color picker popover, anchored to the swatch that opened it. */
  .pick {
    position: absolute; z-index: 20; width: 188px; padding: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 6px 20px rgba(16, 24, 40, .16);
  }
  .pick .pt {
    font-size: 11px; color: var(--muted); margin-bottom: 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pick .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .pick .opt {
    width: 100%; aspect-ratio: 1; border-radius: 4px; cursor: pointer;
    border: 1px solid rgba(16, 24, 40, .12); padding: 0;
  }
  .pick .opt.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pick .hexrow { display: flex; gap: 6px; margin-top: 9px; }
  .pick input {
    flex: 1 1 auto; min-width: 0; font: inherit; font-size: 11.5px;
    padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px;
    background: var(--bg); color: var(--text);
  }
  .pick input.bad { border-color: #d64545; }
  .pick button.act {
    font: inherit; font-size: 11.5px; padding: 4px 8px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 5px;
    background: var(--bg); color: var(--text);
  }
  .pick .reset {
    margin-top: 8px; width: 100%; font: inherit; font-size: 11.5px;
    padding: 4px 6px; cursor: pointer; background: none;
    border: 1px solid var(--line); border-radius: 5px; color: var(--muted);
  }
</style>
</head>
<body>
  <div id="root"></div>
  <!-- React must be on window before the SDK UMD bundle, which reads it as a global peer. -->
  <script src="vendor/react.min.js"></script>
  <script src="vendor/react-dom.min.js"></script>
  <script src="vendor/sigma-plugin.js"></script>
  <script src="format.js"></script>
  <script src="pivot.js"></script>
  <script src="colors.js"></script>
  <script src="styles.js"></script>
  <script src="app.js"></script>
</body>
</html>
